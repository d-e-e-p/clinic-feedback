<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinic Pre-Visit Check-In</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 500px;
      text-align: center;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #2d7ff9;
      color: white;
    }
    .status {
      margin-top: 20px;
      font-size: 14px;
      word-break: break-word;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Family Van Health Care Clinic</h2>
  <p>Start Pre-Visit Check-In</p>
  <button id="startBtn">Start Check-In</button>
  <div id="status" class="status"></div>
</div>

<script>
  // 🔐 HARD-CODED API KEY (NOT SAFE FOR PRODUCTION)
  const API_KEY = "672f4a3ceea442d6bebc23c6be014e4b";

  const context = `
You are interviewing patients at a family van health care clinic.
Follow the script exactly and speak in Spanish.

Start with:
“Hi, welcome to the Family Van Health Care Clinic. Let’s get you checked in!”
section1:
“First, what name would you like us to call you?”
(Pause)
“Hello <whatever name they give you>, What’s your date of birth?”
(Pause)
“What phone number should we use to reach you?”
(Pause)
“Is it okay for us to text you about your care?
Please say ‘yes’ or ‘no.’”
(Pause)
“Great. Let’s move on.”

section2: contact
“In case of emergency, who should we contact?”
(Pause)
“What is your relationship to them?”
(Pause)
“What’s their phone number?”
(Pause)
“Thank you.”

Section 3 — Why Are You Here Today?
“Why are you here today?
You can name one or more reasons.”
(Pause — allow open response)
“If you’d like, say a sentence in your own words about what’s going on.”
(Pause)
“Got it.”

Section 4 — Medical Basics
“Do you have any allergies?”
(Pause)
“Are you taking any medications?”
(Pause)
“Do you have any ongoing health conditions?”
(Pause)
“Thank you.”

Section 5 — Insurance
“Do you have health insurance?
Say ‘yes,’ ‘no,’ or ‘not sure.’”
(Pause)
“If yes, what company?”
(Pause)
“If no or not sure — would you like help finding low-cost care?”

(Pause)
“Thanks.”
Section 6 — Privacy &amp; Signature
“How would you like us to contact you about results —
text, or call?”
(Pause)
“Is it okay to share results with a parent or guardian?
Say ‘yes,’ ‘no’.”
(Pause)
“One last question. Are you having thoughts of hurting yourself today?
Please say ‘yes’ or ‘no.’”
“Please sign below with your finger.”
(Pause)
“Thank you. That completes the check-in ."


`;

  const payload = {
    test_mode: false,
    replica_id: "r3f427f43c9d",
    persona_id: "pcd235e789c2",
    callback_url: "https://clinicfeedback.org/",
    conversation_name: "Pre Visit Checkin",
    custom_greeting: "Hola, bienvenido a la clínica de salud Family Van. ¡Vamos a hacer su registro!",
    conversational_context: context,
    properties: {
      max_call_duration: 300,
      participant_left_timeout: 300,
      participant_absent_timeout: 300,
      language: "spanish",
      enable_closed_captions: true,
      apply_greenscreen: false
    }
  };

  const statusDiv = document.getElementById("status");
  const startBtn = document.getElementById("startBtn");

  startBtn.addEventListener("click", async () => {
    startBtn.disabled = true;
    statusDiv.innerHTML = "Creating conversation...";

    try {
      const response = await fetch("https://tavusapi.com/v2/conversations", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-api-key": API_KEY
        },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || data.message || "Unknown error");
      }

      const conversationUrl = data.conversation_url;

      statusDiv.innerHTML = `
        ✅ Conversation Created<br>
        Redirecting to session...
      `;

      console.log("Conversation created:", data);

      // 🚀 Redirect user to Tavus session
      window.location.href = conversationUrl;

    } catch (err) {
      statusDiv.innerHTML = `<span class="error">Error: ${err.message}</span>`;
      startBtn.disabled = false;
    }
  });
</script>

</body>
</html>
